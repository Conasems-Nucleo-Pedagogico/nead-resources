<script>
    function allowDrop(ev) {
    ev.preventDefault();
    ev.stopPropagation();
    return false;
}

function drag(ev) {

    ev.dataTransfer.setData("text/plain", ev.target.id);

}
function touchdrag(ev) {
    for (i = 0; i < document.getElementsByClassName("selected").length; i++) {
        document.getElementsByClassName("selected")[i].classList.remove("selected");
    }
    if (ev.target.classList.contains("selected")) {
        ev.target.classList.remove("selected");
    } else { ev.target.classList.add("selected"); }
    for (i = 0; i <= 4; i++) { document.getElementsByClassName("containerResp")[i].classList.add("recebendo"); }


}
function touchdrop(ev) {
    if (ev.target.classList.contains("recebendo")) {
        ev.target.appendChild(document.getElementsByClassName("selected")[0]);
        document.getElementsByClassName("selected")[0].classList.remove("selected");
        for (i = 0; i <= 4; i++) { document.getElementsByClassName("containerResp")[i].classList.remove("recebendo"); }

    }

}

function noAllowDrop(ev) {
    //  ev.stopPropagation();
}

function drop(ev) {
    ev.preventDefault();
    var data = ev.dataTransfer.getData("text/plain");

    if (ev.srcElement.id.startsWith("div")) {
        ev.target.appendChild(document.getElementById(data));
    }
    else {
        ev.target.parentElement.appendChild(document.getElementById(data));
    }
    //  var newLn = document.createElement("br");  
    //  ev.target.appendChild(newLn);
}

function shuffle(array) {
    let currentIndex = array.length, randomIndex;

    // While there remain elements to shuffle...
    while (currentIndex != 0) {

        // Pick a remaining element...
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;

        // And swap it with the current element.
        [array[currentIndex].id, array[randomIndex].id] = [
            array[randomIndex].id, array[currentIndex].id];
        [array[currentIndex].resposta, array[randomIndex].resposta] = [
            array[randomIndex].resposta, array[currentIndex].resposta];
    }

    return array;
}
function restartGame() {
    //shuffle(respostas);
    document.getElementsByClassName("feedbackwrapper")[0].style = "display: none;";
    for (i = 0; i < respostas.length; i++) {
        var apender = document.getElementById("drag" + (i + 1));
        apender.innerText = respostas[i].resposta;

    }
    var onResps = document.getElementsByClassName("containerResp");
    var onDiv = document.getElementById("divresp");
    for (i = 0; i < onResps.length; i++) {
        var validSpan = onResps[i];

        for (j = 0; j < validSpan.childNodes.length; j++) {
            var currentOpcao = validSpan.childNodes[j];

            if (currentOpcao.classList.contains("opcao")) {
                currentOpcao.draggable = "true";
                currentOpcao.className = "opcao";
                onDiv.append(currentOpcao);
                restartGame();
            }

        }
    }
}
function checkResult() {

    for (i = 1; i < 6; i++) {
        var x = document.getElementById("div" + i);
        for (j = 0; j < x.children.length; j++) {
            for (k = 0; k < respostas.length; k++) {
                if (respostas[k].resposta == x.children[j].textContent) {
                    if (respostas[k].id == i) {
                        x.children[j].classList.add("correct");
                        x.children[j].classList.add("opcaoCorreta");
                        x.children[j].draggable = false;
                        x.children[j].ontouchstart = "";


                    } else {
                        x.children[j].classList.add("wrongers");
                        x.children[j].classList.add("opcaoError");
                        x.children[j].draggable = false;
                        x.children[j].ontouchstart = "";
                    }
                }
            }




        }
    }
    var certo = document.getElementsByClassName("correct");
    var errado = document.getElementsByClassName("wrongers");
    var feedback = document.getElementById("feedbackGame");
    var final = parseFloat((certo.length / respostas.length) * 100).toFixed(2);
    var finalFeedback = "";
    if (final < 20) {
        finalFeedback = "Tente de novo! Voce acertou " + final + ("% das alternativas");
    } else if (final < 60) {
        finalFeedback = "Estamos melhorando! Você acertou " + final + ("% das alternativas");
    } else if (final < 80) {
        finalFeedback = "Quase lá! Você acertou " + final + ("% das alternativas");
    } else if (final < 95) {

    } else {

    }
    document.getElementsByClassName("feedbackwrapper")[0].style = "display: block;"
    feedback.innerText = finalFeedback;
}
