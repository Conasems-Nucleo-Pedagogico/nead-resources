<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  LINHA DO TEMPO COM SCROLL — NEAD
  Linha vertical com etapas (cartões), relações entre etapas e conclusão. Dois modos:
    - "scroll": a linha amarela cresce acompanhando a rolagem e cada item aparece quando chega
      perto do meio da tela (some de novo ao rolar para cima);
    - "automatico": quando o bloco entra na tela, os itens aparecem sozinhos, um a um, e a linha
      avança até cada marcador (acontece uma vez).

  Como usar no Elementor: cole este bloco inteiro em um widget "HTML".
  Para editar, altere só o JSON dentro de <script class="nead-tl__config">:
    - "modo": "scroll" ou "automatico"; "intervalo": milissegundos entre itens no modo automático
    - "layout": "alternado" (cartões dos dois lados da linha) ou "lista" (todos à direita);
      em espaços estreitos, o alternado vira lista
    - "numerar": true mostra números nos marcadores; false mostra só pontos
    - "introducao": texto (HTML) acima da linha
    - "itens": em ordem. Etapa: "tipo": "etapa", "titulo", "destaque", "texto", "exemplo" (HTML),
      "icone" (URL), "lado" ("esquerda"/"direita"), "variante": "resultado" (cartão verde), "numero".
      Relação: "tipo": "relacao", "rotulo", "texto", "variante": "verde".
    - "conclusao": { "rotulo", "texto" } (opcional)
    - "cores": cartao, cartaoTexto, cartaoBorda, titulo, destaque (linha e marcadores),
      marcadorTexto, trilho (linha cinza), resultado, relacao, relacaoVerde, texto
    - "pontoRevelacao": altura da tela (0 a 1) em que os itens aparecem no modo scroll (padrão 0.75)
  Pode haver várias linhas do tempo na mesma página: repita só o bloco <div class="nead-tl">...</div>.
-->
<style>
  .nead-tl {
    --nead-tl-cartao: #294B8F;
    --nead-tl-cartao-texto: #FFFFFF;
    --nead-tl-cartao-borda: transparent;
    --nead-tl-titulo: #F8CA33;
    --nead-tl-destaque: #F8CA33;
    --nead-tl-marcador-texto: #111111;
    --nead-tl-trilho: #C3C3C3;
    --nead-tl-resultado: #0E4A38;
    --nead-tl-relacao: #213B74;
    --nead-tl-relacao-verde: #0E4A38;
    --nead-tl-texto: #182230;
    --nead-tl-eixo: 22px;
    --nead-tl-recuo: 58px;
    --nead-tl-marca: 54px;
    box-sizing: border-box;
    container-type: inline-size;
    width: 100%;
    max-width: 1180px;
    overflow-x: clip;
    padding: 0 16px;
    margin: 0 auto 40px;
    color: var(--nead-tl-texto);
    font-family: "Nunito", Arial, sans-serif;
  }
  .nead-tl *, .nead-tl *::before, .nead-tl *::after { box-sizing: border-box; }
  .nead-tl.is-pontos { --nead-tl-marca: 22px; }
  .nead-tl__introducao { max-width: 860px; margin: 0 auto 26px; font-size: 18px; line-height: 1.55; }
  .nead-tl__introducao p { margin: 0 0 10px; }
  .nead-tl__trilha { position: relative; padding: 24px 0 10px; }

  /* Linha: trilho tracejado + progresso */
  .nead-tl__linha {
    position: absolute;
    z-index: 1;
    left: 50%;
    width: 3px;
    background: repeating-linear-gradient(to bottom, var(--nead-tl-trilho) 0 10px, transparent 10px 20px);
    transform: translateX(-50%);
    pointer-events: none;
  }
  .nead-tl__progresso {
    position: absolute;
    top: 0;
    left: 50%;
    width: 5px;
    height: 0;
    border-radius: 5px;
    background: var(--nead-tl-destaque);
    transform: translateX(-50%);
  }
  .nead-tl.is-automatico .nead-tl__progresso { transition: height 1.2s ease; }

  /* Etapa */
  .nead-tl__etapa {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: 1fr 80px 1fr;
    align-items: center;
    padding: 34px 0;
    opacity: 0;
    transition: opacity 0.55s ease, transform 0.65s cubic-bezier(0.2, 0.75, 0.25, 1);
  }
  .nead-tl__etapa--esquerda { transform: translateX(-45px); }
  .nead-tl__etapa--direita { transform: translateX(45px); }
  .nead-tl__etapa.is-visivel { opacity: 1; transform: none; }
  .nead-tl__marcador {
    position: relative;
    z-index: 4;
    display: grid;
    grid-column: 2;
    grid-row: 1;
    justify-self: center;
    place-items: center;
    width: var(--nead-tl-marca);
    aspect-ratio: 1;
    border: 7px solid #FFFFFF;
    border-radius: 50%;
    background: var(--nead-tl-destaque);
    color: var(--nead-tl-marcador-texto);
    box-shadow: 0 5px 18px rgba(33, 59, 116, 0.22);
    font-size: 18px;
    font-weight: 900;
    transform: scale(0.65);
    transition: transform 0.45s 0.1s cubic-bezier(0.2, 0.9, 0.3, 1.35);
  }
  .nead-tl.is-pontos .nead-tl__marcador { border-width: 5px; font-size: 0; }
  .nead-tl__etapa.is-visivel .nead-tl__marcador { transform: scale(1); }
  /* Ligação cartão-marcador */
  .nead-tl__etapa::before {
    content: "";
    position: absolute;
    z-index: 1;
    top: 50%;
    width: calc(40px - var(--nead-tl-marca) / 2);
    height: 3px;
    background: var(--nead-tl-destaque);
    transform: translateY(-50%) scaleX(0);
    transition: transform 0.45s 0.2s ease;
  }
  .nead-tl__etapa--esquerda::before { left: calc(50% - 40px); transform-origin: left; }
  .nead-tl__etapa--direita::before { left: calc(50% + var(--nead-tl-marca) / 2); transform-origin: left; }
  .nead-tl__etapa.is-visivel::before { transform: translateY(-50%) scaleX(1); }

  .nead-tl__cartao {
    position: relative;
    grid-row: 1;
    width: min(100%, 470px);
    padding: 26px;
    border: 2px solid var(--nead-tl-cartao-borda);
    border-radius: 24px;
    background: var(--nead-tl-cartao);
    color: var(--nead-tl-cartao-texto);
    box-shadow: 0 18px 40px rgba(33, 59, 116, 0.15);
    font-size: 16px;
    line-height: 1.6;
  }
  .nead-tl__etapa--esquerda .nead-tl__cartao { grid-column: 1; justify-self: end; }
  .nead-tl__etapa--direita .nead-tl__cartao { grid-column: 3; justify-self: start; }
  .nead-tl__etapa--resultado .nead-tl__cartao { background: var(--nead-tl-resultado); }
  .nead-tl__cabecalho { display: flex; align-items: center; gap: 13px; margin-bottom: 16px; }
  .nead-tl__icone {
    display: grid;
    flex: 0 0 auto;
    place-items: center;
    width: 50px;
    aspect-ratio: 1;
    border: 1px solid rgba(255, 255, 255, 0.26);
    border-radius: 15px;
    background: rgba(255, 255, 255, 0.1);
  }
  .nead-tl__icone img { width: 24px; height: 24px; object-fit: contain; }
  .nead-tl__cartao h3 { margin: 0; color: var(--nead-tl-titulo); font-size: 23px; line-height: 1.25; }
  .nead-tl__cartao p { margin: 0; }
  .nead-tl__cartao p + p { margin-top: 12px; }
  .nead-tl__destaque { font-size: 17px; font-weight: 900; }
  .nead-tl__exemplo { font-weight: 800; }

  /* Relação entre etapas */
  .nead-tl__relacao {
    position: relative;
    z-index: 3;
    display: grid;
    place-items: center;
    width: min(100%, 470px);
    min-height: 120px;
    margin: 14px auto;
    padding: 20px 25px;
    border: 2px dashed var(--nead-tl-relacao);
    border-radius: 20px;
    background: #FFFFFF;
    color: var(--nead-tl-relacao);
    box-shadow: 0 12px 30px rgba(33, 59, 116, 0.11);
    text-align: center;
    opacity: 0;
    transform: translateY(25px) scale(0.96);
    transition: opacity 0.55s ease, transform 0.6s cubic-bezier(0.2, 0.75, 0.25, 1);
  }
  .nead-tl__relacao.is-visivel { opacity: 1; transform: none; }
  .nead-tl__relacao--verde { border-color: var(--nead-tl-relacao-verde); color: var(--nead-tl-relacao-verde); }
  .nead-tl__verbo {
    display: inline-flex;
    padding: 7px 14px;
    border-radius: 999px;
    background: var(--nead-tl-destaque);
    color: var(--nead-tl-marcador-texto);
    font-size: 15px;
    font-weight: 900;
    text-transform: uppercase;
  }
  .nead-tl__relacao p { margin: 9px 0 0; font-size: 16px; line-height: 1.5; }

  /* Conclusão */
  .nead-tl__conclusao {
    position: relative;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    width: min(100%, 980px);
    margin: 40px auto 0;
    padding: 21px 27px;
    border-radius: 18px;
    background: var(--nead-tl-destaque);
    color: var(--nead-tl-marcador-texto);
    box-shadow: 0 15px 35px rgba(33, 59, 116, 0.13);
    font-size: 17px;
    line-height: 1.55;
    text-align: center;
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .nead-tl__conclusao.is-visivel { opacity: 1; transform: none; }

  /* Lista: todos os cartões à direita da linha (também é o layout em espaços estreitos) */
  .nead-tl--lista .nead-tl__trilha { padding-left: var(--nead-tl-recuo); }
  .nead-tl--lista .nead-tl__linha { left: var(--nead-tl-eixo); }
  .nead-tl--lista .nead-tl__etapa { grid-template-columns: 1fr; padding: 0; margin-bottom: 36px; }
  .nead-tl--lista .nead-tl__etapa--esquerda,
  .nead-tl--lista .nead-tl__etapa--direita { transform: translateX(35px); }
  .nead-tl--lista .nead-tl__etapa.is-visivel { transform: none; }
  .nead-tl--lista .nead-tl__cartao { grid-column: 1; justify-self: stretch; width: 100%; }
  .nead-tl--lista .nead-tl__marcador {
    position: absolute;
    top: 26px;
    left: calc(var(--nead-tl-eixo) - var(--nead-tl-recuo) - var(--nead-tl-marca) / 2);
    grid-column: auto;
  }
  .nead-tl--lista .nead-tl__etapa::before,
  .nead-tl--lista .nead-tl__etapa--esquerda::before,
  .nead-tl--lista .nead-tl__etapa--direita::before {
    top: calc(26px + var(--nead-tl-marca) / 2);
    left: calc(var(--nead-tl-eixo) - var(--nead-tl-recuo) + var(--nead-tl-marca) / 2);
    width: calc(var(--nead-tl-recuo) - var(--nead-tl-eixo) - var(--nead-tl-marca) / 2);
  }
  .nead-tl--lista .nead-tl__relacao { width: 100%; margin: 0 0 36px; transform: translateX(30px); }
  .nead-tl--lista .nead-tl__relacao.is-visivel { transform: none; }
  .nead-tl--lista .nead-tl__relacao::before {
    content: "";
    position: absolute;
    top: 50%;
    left: calc(var(--nead-tl-eixo) - var(--nead-tl-recuo) - 2px);
    width: calc(var(--nead-tl-recuo) - var(--nead-tl-eixo));
    height: 3px;
    background: var(--nead-tl-destaque);
  }
  .nead-tl--lista .nead-tl__conclusao { margin-top: 10px; }
  .nead-tl--lista .nead-tl__introducao { margin-left: 0; }

  @container (max-width: 600px) {
    .nead-tl { --nead-tl-recuo: 50px; }
    .nead-tl:not(.is-pontos) { --nead-tl-marca: 44px; }
    .nead-tl__cartao { padding: 20px; border-radius: 20px; font-size: 15px; }
    .nead-tl__cabecalho { align-items: flex-start; flex-wrap: wrap; }
    .nead-tl__cartao h3 { font-size: 20px; }
    .nead-tl__relacao, .nead-tl__conclusao { font-size: 15px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .nead-tl *, .nead-tl *::before, .nead-tl *::after { transition-duration: 0.01ms !important; }
  }
</style>

<script>
  (function () {
    if (window.NeadTimeline) {
      window.NeadTimeline.initAll();
      return;
    }
    var CORES = {
      cartao: '--nead-tl-cartao',
      cartaoTexto: '--nead-tl-cartao-texto',
      cartaoBorda: '--nead-tl-cartao-borda',
      titulo: '--nead-tl-titulo',
      destaque: '--nead-tl-destaque',
      marcadorTexto: '--nead-tl-marcador-texto',
      trilho: '--nead-tl-trilho',
      resultado: '--nead-tl-resultado',
      relacao: '--nead-tl-relacao',
      relacaoVerde: '--nead-tl-relacao-verde',
      texto: '--nead-tl-texto'
    };
    var LARGURA_LISTA = 760;
    var semMovimento = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function criar(tag, classe, html) {
      var el = document.createElement(tag);
      if (classe) el.className = classe;
      if (html != null) el.innerHTML = html;
      return el;
    }

    function etapa(item, n) {
      var lado = item.lado === 'direita' || item.lado === 'esquerda' ? item.lado : (n % 2 ? 'esquerda' : 'direita');
      var el = criar('article', 'nead-tl__etapa nead-tl__etapa--' + lado + (item.variante === 'resultado' ? ' nead-tl__etapa--resultado' : ''));
      el.dataset.lado = lado;
      var marcador = criar('span', 'nead-tl__marcador');
      marcador.setAttribute('aria-hidden', 'true');
      marcador.textContent = item.numero != null ? item.numero : n;
      var cartao = criar('div', 'nead-tl__cartao');
      if (item.titulo || item.icone) {
        var cab = criar('div', 'nead-tl__cabecalho');
        if (item.icone) {
          var ic = criar('span', 'nead-tl__icone');
          ic.setAttribute('aria-hidden', 'true');
          var img = document.createElement('img');
          img.src = item.icone;
          img.alt = '';
          ic.appendChild(img);
          cab.appendChild(ic);
        }
        if (item.titulo) cab.appendChild(criar('h3', null, item.titulo));
        cartao.appendChild(cab);
      }
      if (item.destaque) cartao.appendChild(criar('p', 'nead-tl__destaque', item.destaque));
      if (item.texto) cartao.appendChild(criar('p', null, item.texto));
      if (item.exemplo) cartao.appendChild(criar('p', 'nead-tl__exemplo', item.exemplo));
      el.append(marcador, cartao);
      return el;
    }

    function relacao(item) {
      var el = criar('div', 'nead-tl__relacao' + (item.variante === 'verde' ? ' nead-tl__relacao--verde' : ''));
      if (item.rotulo) el.appendChild(criar('span', 'nead-tl__verbo', item.rotulo));
      if (item.texto) el.appendChild(criar('p', null, item.texto));
      return el;
    }

    function montar(raiz) {
      if (raiz.__neadTlPronto) return;
      var configEl = raiz.querySelector('.nead-tl__config');
      var cfg;
      try {
        cfg = JSON.parse(configEl.textContent);
      } catch (erro) {
        raiz.textContent = 'Linha do tempo: o JSON de configuração está inválido.';
        console.error('[nead-tl] JSON inválido', erro);
        return;
      }
      raiz.__neadTlPronto = true;
      configEl.remove();

      var automatico = cfg.modo === 'automatico';
      var layoutLista = cfg.layout === 'lista';
      var intervalo = Number(cfg.intervalo) || 1600;
      var ponto = Number(cfg.pontoRevelacao) || 0.75;
      Object.keys(cfg.cores || {}).forEach(function (k) {
        if (CORES[k]) raiz.style.setProperty(CORES[k], cfg.cores[k]);
      });
      raiz.classList.add(automatico ? 'is-automatico' : 'is-scroll');
      if (cfg.numerar === false) raiz.classList.add('is-pontos');

      if (cfg.introducao) raiz.appendChild(criar('div', 'nead-tl__introducao', cfg.introducao));
      var trilha = criar('div', 'nead-tl__trilha');
      var linha = criar('div', 'nead-tl__linha');
      linha.setAttribute('aria-hidden', 'true');
      var progresso = criar('div', 'nead-tl__progresso');
      linha.appendChild(progresso);
      trilha.appendChild(linha);

      var itens = [];
      var n = 0;
      (cfg.itens || []).forEach(function (item) {
        var el = item.tipo === 'relacao' ? relacao(item) : etapa(item, ++n);
        trilha.appendChild(el);
        itens.push(el);
      });
      var conclusao = null;
      if (cfg.conclusao) {
        conclusao = criar('div', 'nead-tl__conclusao');
        conclusao.appendChild(criar('strong', null, cfg.conclusao.rotulo || 'Conclusão:'));
        conclusao.appendChild(criar('span', null, cfg.conclusao.texto || ''));
        trilha.appendChild(conclusao);
      }
      raiz.appendChild(trilha);
      var animados = conclusao ? itens.concat(conclusao) : itens;

      // Posição (em px, a partir do topo da trilha) do ponto de cada item sobre a linha:
      // centro do marcador nas etapas, centro da caixa nas relações
      var pontos = [], inicio = 0;
      function medir() {
        raiz.classList.toggle('nead-tl--lista', layoutLista || raiz.clientWidth < LARGURA_LISTA);
        // offsetTop/offsetHeight ignoram os deslocamentos da animação de entrada
        pontos = itens.map(function (el) {
          var marcador = el.querySelector('.nead-tl__marcador');
          return marcador
            ? el.offsetTop + marcador.offsetTop + marcador.offsetHeight / 2
            : el.offsetTop + el.offsetHeight / 2;
        });
        if (!pontos.length) return;
        inicio = pontos[0];
        linha.style.top = inicio + 'px';
        linha.style.height = Math.max(0, pontos[pontos.length - 1] - inicio) + 'px';
      }

      // ---- Modo scroll: a ponta da linha segue a altura "pontoRevelacao" da tela
      var agendado = false, perto = true;
      function atualizarScroll() {
        agendado = false;
        if (!raiz.isConnected) return;
        var alturaTela = window.innerHeight || document.documentElement.clientHeight;
        var corte = alturaTela * ponto;
        var topo = trilha.getBoundingClientRect().top;
        var total = pontos.length ? pontos[pontos.length - 1] - inicio : 0;
        progresso.style.height = Math.max(0, Math.min(total, corte - topo - inicio)) + 'px';
        animados.forEach(function (el) {
          el.classList.toggle('is-visivel', el.getBoundingClientRect().top < corte);
        });
      }
      function agendar() {
        if (!perto || agendado) return;
        agendado = true;
        requestAnimationFrame(atualizarScroll);
      }

      // ---- Modo automático: revela um item por vez quando o bloco entra na tela
      var iniciado = false;
      function revelar(i) {
        if (i >= animados.length) return;
        animados[i].classList.add('is-visivel');
        if (i < pontos.length) progresso.style.height = Math.max(0, pontos[i] - inicio) + 'px';
      }
      function iniciarSequencia() {
        if (iniciado) return;
        iniciado = true;
        if (semMovimento) {
          animados.forEach(function (el, i) { revelar(i); });
          return;
        }
        animados.forEach(function (el, i) {
          setTimeout(function () { revelar(i); }, i * intervalo);
        });
      }

      function aoRedimensionar() {
        medir();
        if (automatico) {
          // mantém a linha no ponto do último item já revelado
          var ultimo = -1;
          itens.forEach(function (el, i) { if (el.classList.contains('is-visivel')) ultimo = i; });
          progresso.style.height = ultimo > -1 ? Math.max(0, pontos[ultimo] - inicio) + 'px' : '0px';
        } else {
          agendar();
        }
      }

      medir();
      if (typeof ResizeObserver === 'function') new ResizeObserver(aoRedimensionar).observe(raiz);
      else window.addEventListener('resize', aoRedimensionar);

      if (automatico) {
        if (typeof IntersectionObserver !== 'function') { iniciarSequencia(); return; }
        var obs = new IntersectionObserver(function (entradas) {
          if (entradas.some(function (e) { return e.isIntersecting; })) {
            obs.disconnect();
            iniciarSequencia();
          }
        }, { threshold: 0.25 });
        obs.observe(trilha);
      } else {
        // captura: também percebe rolagem de contêineres (ex.: seções com rolagem própria)
        window.addEventListener('scroll', agendar, { passive: true, capture: true });
        window.addEventListener('resize', agendar, { passive: true });
        if (typeof IntersectionObserver === 'function') {
          new IntersectionObserver(function (entradas) {
            perto = entradas[0].isIntersecting;
            if (perto) agendar();
          }, { rootMargin: '50% 0px 50% 0px' }).observe(trilha);
        }
        agendar();
      }
    }

    window.NeadTimeline = {
      initAll: function (escopo) { (escopo || document).querySelectorAll('.nead-tl').forEach(montar); }
    };
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () { window.NeadTimeline.initAll(); });
    } else {
      window.NeadTimeline.initAll();
    }
  })();
</script>
